<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#07141f"/>
      <stop offset="80%" stop-color="#04201c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Glow Accent -->
    <radialGradient id="footerGlowGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="footerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="footerTechGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="0.8" fill="#2dd4bf" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .footer-quote { font-size: 15px; fill: #f8fafc; letter-spacing: 4px; font-weight: 800; }
    .footer-sub { font-size: 11px; fill: #2dd4bf; letter-spacing: 3px; font-weight: 600; }
    .footer-meta { font-size: 10px; fill: #64748b; letter-spacing: 2px; }
  </style>

  <!-- Container Box -->
  <rect width="1198" height="158" x="1" y="1" rx="14" fill="url(#footerBgGrad)"/>
  <rect width="1198" height="158" x="1" y="1" rx="14" fill="url(#footerGlowGrad)"/>
  <rect width="1198" height="158" x="1" y="1" rx="14" fill="url(#footerTechGrid)"/>
  <rect width="1198" height="158" x="1" y="1" rx="14" fill="none" stroke="url(#footerBorderGrad)" stroke-width="1.6"/>

  <!-- Corner Brackets -->
  <g stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.6">
    <path d="M 20 28 L 20 20 L 28 20"/>
    <path d="M 1180 28 L 1180 20 L 1172 20"/>
    <path d="M 20 132 L 20 140 L 28 140"/>
    <path d="M 1180 132 L 1180 140 L 1172 140"/>
  </g>

  <!-- Top Accent Laser Line -->
  <line x1="40" y1="26" x2="1160" y2="26" stroke="#1e293b" stroke-width="1"/>
  <line x1="460" y1="26" x2="740" y2="26" stroke="#0d9488" stroke-width="1.6"/>
  <line x1="550" y1="26" x2="650" y2="26" stroke="#2dd4bf" stroke-width="2.4"/>

  <!-- Centered Content -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <!-- Live Pulse Indicators -->
    <g transform="translate(-290, -4)">
      <circle cx="0" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
        <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text y="2" class="mono footer-quote">CLEAN ARCHITECTURE // INTENTIONAL DESIGN // SCALABLE EXECUTION</text>

    <g transform="translate(290, -4)">
      <circle cx="0" cy="0" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
        <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text y="32" class="mono footer-sub">FULL-STACK SOFTWARE ENGINEER &#x2022; BRAND ARCHITECT</text>
    <text y="54" class="mono footer-meta">DESIGNED &amp; ENGINEERED BY S SINDID AHMED NABIL &#x2022; 2026 &#x2022; ALL RIGHTS RESERVED</text>
  </g>

  <!-- Bottom Line & Telemetry -->
  <line x1="40" y1="134" x2="1160" y2="134" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="1020" y1="134" x2="1160" y2="134" stroke="#2dd4bf" stroke-width="1.5"/>
  <line x1="40" y1="134" x2="180" y2="134" stroke="#0d9488" stroke-width="1.5"/>
</svg>
