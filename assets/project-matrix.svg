<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pMatrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#071524"/>
      <stop offset="70%" stop-color="#04221d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="pMatrixGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="pMatrixBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Individual Card Gradients -->
    <linearGradient id="cBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052620"/>
      <stop offset="100%" stop-color="#021211"/>
    </linearGradient>

    <linearGradient id="cBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f31"/>
      <stop offset="100%" stop-color="#03101b"/>
    </linearGradient>

    <linearGradient id="cBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062325"/>
      <stop offset="100%" stop-color="#021214"/>
    </linearGradient>

    <linearGradient id="cBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0f29"/>
      <stop offset="100%" stop-color="#0d0514"/>
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1626"/>
      <stop offset="100%" stop-color="#050e18"/>
