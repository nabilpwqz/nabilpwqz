<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07141f"/>
      <stop offset="80%" stop-color="#04201c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Emerald/Cyan Core Glow -->
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Name Title Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0fdfa"/>
      <stop offset="75%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1726"/>
      <stop offset="100%" stop-color="#05141b"/>
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.09"/>
      <circle cx="0" cy="0" r="0.9" fill="#2dd4bf" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .name-title { font-weight: 900; font-size: 42px; fill: url(#titleGrad); letter-spacing: 5px; }
    .role-subtitle { font-weight: 700; font-size: 13.5px; fill: #2dd4bf; letter-spacing: 6px; }
    .hud-text { font-size: 10.5px; fill: #94a3b8; letter-spacing: 1.5px; font-weight: 600; }
    .chip-text { font-size: 10.5px; fill: #e2e8f0; letter-spacing: 2px; font-weight: 600; }
    .window-title { font-size: 11px; fill: #64748b; letter-spacing: 1px; }
  </style>

  <!-- Base Panels -->
  <rect width="1198" height="298" x="1" y="1" rx="14" fill="url(#bgGrad)"/>
  <rect width="1198" height="298" x="1" y="1" rx="14" fill="url(#heroGlow)"/>
  <rect width="1198" height="298" x="1" y="1" rx="14" fill="url(#techGrid)"/>
  <rect width="1198" height="298" x="1" y="1" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.6"/>

  <!-- Top Window Header Bar -->
  <rect x="1" y="1" width="1198" height="42" rx="14" fill="#040b15" fill-opacity="0.85"/>
  <line x1="1" y1="43" x2="1199" y2="43" stroke="#1e293b" stroke-width="1"/>

  <!-- Terminal Window Control Dots -->
  <g transform="translate(30, 22)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="16" cy="0" r="5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="32" cy="0" r="5" fill="#10b981" fill-opacity="0.85"/>
    <text x="56" y="4" class="mono window-title">nabilpwqz@production-system ~ [zsh]</text>
  </g>

  <!-- Top Right Telemetry -->
  <g transform="translate(820, 26)" text-anchor="start">
    <circle cx="0" cy="-3" r="3.5" fill="#10b981"/>
    <circle cx="0" cy="-3" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="14" y="0" class="mono hud-text">SYS_STATUS: ACTIVE [100%]</text>
    <text x="210" y="0" class="mono hud-text" fill="#64748b">|</text>
    <text x="230" y="0" class="mono hud-text">LOC: DHAKA, BD</text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.5">
    <path d="M 22 62 L 22 54 L 30 54"/>
    <path d="M 1178 62 L 1178 54 L 1170 54"/>
    <path d="M 22 276 L 22 284 L 30 284"/>
    <path d="M 1178 276 L 1178 284 L 1170 284"/>
  </g>

  <!-- Hero Titles -->
  <g transform="translate(600, 132)" text-anchor="middle">
    <text y="0" class="sans name-title">S SINDID AHMED NABIL</text>
    <text y="38" class="mono role-subtitle">FULL-STACK SOFTWARE ENGINEER // BRAND ARCHITECT</text>
  </g>

  <!-- Divider Line with Center Glowing Core -->
  <line x1="50" y1="192" x2="1150" y2="192" stroke="#1e293b" stroke-width="1"/>
  <line x1="450" y1="192" x2="750" y2="192" stroke="#0d9488" stroke-width="1.8"/>
  <line x1="550" y1="192" x2="650" y2="192" stroke="#2dd4bf" stroke-width="2.5"/>

  <!-- Tech Spec Chips at Bottom -->
  <g transform="translate(600, 244)" text-anchor="middle">
    <!-- Chip 1: MERN Architecture -->
    <g transform="translate(-390, 0)">
      <rect x="-86" y="-15" width="172" height="30" rx="7" fill="url(#chipBg)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="-68" cy="0" r="3" fill="#2dd4bf"/>
      <text x="8" y="4" class="mono chip-text">MERN ARCHITECTURE</text>
    </g>

    <!-- Chip 2: Next.js 14+ Full-Stack -->
    <g transform="translate(-195, 0)">
      <rect x="-86" y="-15" width="172" height="30" rx="7" fill="url(#chipBg)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="-68" cy="0" r="3" fill="#38bdf8"/>
      <text x="8" y="4" class="mono chip-text">NEXT.JS FULL-STACK</text>
    </g>

    <!-- Chip 3: Distributed APIs -->
    <g transform="translate(0, 0)">
      <rect x="-86" y="-15" width="172" height="30" rx="7" fill="url(#chipBg)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="-68" cy="0" r="3" fill="#10b981"/>
      <text x="8" y="4" class="mono chip-text">DISTRIBUTED APIs</text>
    </g>

    <!-- Chip 4: High-Throughput DBs -->
    <g transform="translate(195, 0)">
      <rect x="-86" y="-15" width="172" height="30" rx="7" fill="url(#chipBg)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="-68" cy="0" r="3" fill="#a855f7"/>
      <text x="8" y="4" class="mono chip-text">DATABASE SYSTEMS</text>
    </g>

    <!-- Chip 5: Brand & Design Systems -->
    <g transform="translate(390, 0)">
      <rect x="-86" y="-15" width="172" height="30" rx="7" fill="url(#chipBg)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="-68" cy="0" r="3" fill="#f43f5e"/>
      <text x="8" y="4" class="mono chip-text">DESIGN SYSTEMS</text>
    </g>
  </g>
</svg>
