<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="50%" stop-color="#07151e"/>
      <stop offset="100%" stop-color="#052822"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0d9488"/>
      <stop offset="65%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="0" cy="0" r="1" fill="#2dd4bf" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 40px; fill: url(#textGrad); letter-spacing: 4px; }
    .subtitle { font-weight: 600; font-size: 14px; fill: #2dd4bf; letter-spacing: 6px; }
    .status-text { font-size: 11px; fill: #94a3b8; letter-spacing: 1.5px; }
    .pill-text { font-size: 11px; fill: #cbd5e1; letter-spacing: 2px; font-weight: 500; }
  </style>

  <!-- Container Box -->
  <rect width="1198" height="278" x="1" y="1" rx="12" fill="url(#bgGradient)"/>
  <rect width="1198" height="278" x="1" y="1" rx="12" fill="url(#centerGlow)"/>
  <rect width="1198" height="278" x="1" y="1" rx="12" fill="url(#grid)"/>
  <rect width="1198" height="278" x="1" y="1" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Telemetry Status Bar -->
  <g transform="translate(40, 36)">
    <!-- Active Status Pulse -->
    <circle cx="6" cy="6" r="4" fill="#10b981"/>
    <circle cx="6" cy="6" r="8" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="10" class="mono status-text">SYSTEM: OPERATIONAL</text>
    <text x="260" y="10" class="mono status-text" fill-opacity="0.5">|</text>
    <text x="290" y="10" class="mono status-text">BASE: 23.8103° N, 90.4125° E (DHAKA)</text>
    <text x="640" y="10" class="mono status-text" fill-opacity="0.5">|</text>
    <text x="670" y="10" class="mono status-text">SECURITY: DEFENSIVE ARCHITECTURE</text>
  </g>

  <!-- Top Decorative Corner Crosshairs -->
  <g stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5">
    <path d="M 25 18 L 25 28 M 20 23 L 30 23"/>
    <path d="M 1175 18 L 1175 28 M 1170 23 L 1180 23"/>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="58" x2="1160" y2="58" stroke="#1e293b" stroke-width="1"/>
  <line x1="40" y1="58" x2="180" y2="58" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Main Hero Titles -->
  <g transform="translate(600, 126)" text-anchor="middle">
    <text y="0" class="sans title">S SINDID AHMED NABIL</text>
    <text y="36" class="mono subtitle">FULL-STACK SOFTWARE ENGINEER // BRAND ARCHITECT</text>
  </g>

  <!-- Tech Spec Pills at Bottom -->
  <g transform="translate(600, 218)" text-anchor="middle">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
      <text y="5" class="mono pill-text">MERN ARCHITECTURE</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
      <text y="5" class="mono pill-text">NEXT.JS 14+ FULLSTACK</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
      <text y="5" class="mono pill-text">DISTRIBUTED BACKENDS</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(200, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
      <text y="5" class="mono pill-text">BRAND &amp; DESIGN SYSTEMS</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(380, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="6" fill="#0b1320" stroke="#1e293b" stroke-width="1"/>
      <text y="5" class="mono pill-text">SYSTEM DESIGN</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="40" y1="256" x2="1160" y2="256" stroke="#1e293b" stroke-width="0.8"/>
  <line x1="1020" y1="256" x2="1160" y2="256" stroke="#2dd4bf" stroke-width="1.2"/>
</svg>
