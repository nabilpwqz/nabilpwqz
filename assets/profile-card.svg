<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="profCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#071521"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="profGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0d9488" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="profBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#0d9488"/>
      <stop offset="70%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Inner Panel Gradient -->
    <linearGradient id="innerPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1624"/>
      <stop offset="100%" stop-color="#06121a"/>
    </linearGradient>

    <!-- Tech Dot Grid -->
    <pattern id="profGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#14b8a6" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .titlebar-text { font-size: 11px; fill: #64748b; letter-spacing: 1px; }
    .label { font-size: 10px; fill: #14b8a6; letter-spacing: 2px; font-weight: 700; }
    .val-main { font-size: 14px; fill: #f8fafc; font-weight: 700; letter-spacing: 0.5px; }
    .val-sub { font-size: 12px; fill: #cbd5e1; font-weight: 500; }
    .badge-text { font-size: 10px; fill: #2dd4bf; letter-spacing: 1.5px; font-weight: 700; }
    .pillar-text { font-size: 11.5px; fill: #e2e8f0; font-weight: 500; }
  </style>

  <!-- Container Box -->
  <rect width="938" height="308" x="1" y="1" rx="12" fill="url(#profCardBg)"/>
  <rect width="938" height="308" x="1" y="1" rx="12" fill="url(#profGlow)"/>
  <rect width="938" height="308" x="1" y="1" rx="12" fill="url(#profGrid)"/>
  <rect width="938" height="308" x="1" y="1" rx="12" fill="none" stroke="url(#profBorder)" stroke-width="1.4"/>

  <!-- Top Titlebar -->
  <rect x="1" y="1" width="938" height="36" rx="12" fill="#040a14" fill-opacity="0.85"/>
  <line x1="1" y1="37" x2="939" y2="37" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <g transform="translate(24, 19)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="28" cy="0" r="4.5" fill="#10b981" fill-opacity="0.8"/>
    <text x="48" y="3.5" class="mono titlebar-text">manifesto.config.ts // EXECUTIVE PROFILE MATRIX</text>
  </g>

  <!-- Titlebar Telemetry -->
  <g transform="translate(910, 19)" text-anchor="end">
    <circle cx="-130" cy="0" r="3" fill="#10b981"/>
    <text x="-115" y="3.5" class="mono" font-size="10" fill="#94a3b8" letter-spacing="1px">STATUS: OPEN FOR ROLES</text>
  </g>

  <!-- Main Content Grid -->
  <!-- Left Column: Core Identity & Dual Discipline -->
  <g transform="translate(30, 56)">
    <!-- Identity Field -->
    <g transform="translate(0, 0)">
      <text y="10" class="mono label">01 // IDENTITY &amp; BASE</text>
      <text y="30" class="sans val-main">S Sindid Ahmed Nabil</text>
      <text y="48" class="mono" font-size="11" fill="#94a3b8">DHAKA, BANGLADESH [23.8103° N, 90.4125° E &#x2022; UTC+6]</text>
    </g>

    <!-- Discipline Field -->
    <g transform="translate(0, 74)">
      <text y="10" class="mono label">02 // PRIMARY DISCIPLINE</text>
      <text y="30" class="sans val-main">Full-Stack Software Engineering</text>
      <text y="48" class="sans val-sub">MERN Architecture &#x2022; Next.js 14+ Full-Stack &#x2022; Scalable Distributed APIs</text>
    </g>

    <!-- Secondary Advantage -->
    <g transform="translate(0, 148)">
      <text y="10" class="mono label">03 // DUAL-THREAT ADVANTAGE</text>
      <text y="30" class="sans val-main" fill="#38bdf8">5+ Years Visual Systems &amp; Brand Architecture</text>
      <text y="48" class="sans val-sub">Design Tokens &#x2022; Vector Art &#x2022; Rapid Prototyping to Production UI</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="490" y1="56" x2="490" y2="250" stroke="#1e293b" stroke-width="1"/>
  <line x1="490" y1="110" x2="490" y2="190" stroke="#0d9488" stroke-width="1.5"/>

  <!-- Right Column: Architectural Pillars & Philosophy -->
  <g transform="translate(520, 56)">
    <text y="10" class="mono label">04 // ARCHITECTURAL PILLARS &amp; CORE VALUES</text>

    <!-- Pillar 1 -->
    <g transform="translate(0, 30)">
      <rect x="0" y="-12" width="390" height="34" rx="6" fill="url(#innerPanel)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="5" r="3" fill="#2dd4bf"/>
      <text x="30" y="9" class="mono pillar-text"><tspan fill="#2dd4bf" font-weight="700">Clean Code:</tspan> Modular, DRY, strictly typed TypeScript</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(0, 72)">
      <rect x="0" y="-12" width="390" height="34" rx="6" fill="url(#innerPanel)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="5" r="3" fill="#38bdf8"/>
      <text x="30" y="9" class="mono pillar-text"><tspan fill="#38bdf8" font-weight="700">Defensive Architecture:</tspan> Zero-trust validation &amp; fault tolerance</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(0, 114)">
      <rect x="0" y="-12" width="390" height="34" rx="6" fill="url(#innerPanel)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="5" r="3" fill="#10b981"/>
      <text x="30" y="9" class="mono pillar-text"><tspan fill="#10b981" font-weight="700">Performance Optimization:</tspan> Sub-100ms API latency &amp; edge caching</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(0, 156)">
      <rect x="0" y="-12" width="390" height="34" rx="6" fill="url(#innerPanel)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="5" r="3" fill="#f43f5e"/>
      <text x="30" y="9" class="mono pillar-text"><tspan fill="#f43f5e" font-weight="700">High UX Fidelity:</tspan> 99+ Core Web Vitals &amp; token design consistency</text>
    </g>
  </g>

  <!-- Bottom Telemetry Banner -->
  <g transform="translate(30, 266)">
    <rect x="0" y="0" width="880" height="30" rx="6" fill="#040b15" stroke="#1e293b" stroke-width="1"/>
    <!-- Pulse -->
    <circle cx="18" cy="15" r="3.5" fill="#10b981"/>
    <circle cx="18" cy="15" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="36" y="19" class="mono" font-size="10.5" fill="#94a3b8" letter-spacing="1.5px">STATUS:</text>
    <text x="96" y="19" class="mono" font-size="10.5" fill="#2dd4bf" font-weight="700" letter-spacing="1px">AVAILABLE FOR FULL-STACK ROLES &amp; HIGH-IMPACT COLLABORATIONS</text>
    <text x="860" y="19" text-anchor="end" class="mono" font-size="10" fill="#64748b">[ ACTIVE ]</text>
  </g>
</svg>
