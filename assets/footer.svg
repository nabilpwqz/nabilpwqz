<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052822"/>
      <stop offset="50%" stop-color="#07151e"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0d9488"/>
      <stop offset="65%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="footerGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .quote { font-size: 14px; fill: #cbd5e1; letter-spacing: 3px; font-weight: 500; }
    .meta { font-size: 10px; fill: #64748b; letter-spacing: 2px; }
  </style>

  <!-- Container Box -->
  <rect width="1198" height="108" x="1" y="1" rx="10" fill="url(#footerBg)"/>
  <rect width="1198" height="108" x="1" y="1" rx="10" fill="url(#footerGrid)"/>
  <rect width="1198" height="108" x="1" y="1" rx="10" fill="none" stroke="url(#footerBorder)" stroke-width="1.2"/>

  <!-- Centered Content -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <text y="0" class="mono quote">CLEAN ARCHITECTURE &bull; INTENTIONAL DESIGN &bull; SCALABLE EXECUTION</text>
    <text y="26" class="mono meta">DESIGNED &amp; ENGINEERED BY S SINDID AHMED NABIL &bull; 2026</text>
  </g>
</svg>
