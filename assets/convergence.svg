<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="convBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#071524"/>
      <stop offset="70%" stop-color="#04221d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Glow Accent -->
    <radialGradient id="convGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="convBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cEngBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a2a"/>
      <stop offset="100%" stop-color="#030f18"/>
    </linearGradient>

    <linearGradient id="cDesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06221c"/>
      <stop offset="100%" stop-color="#02120f"/>
    </linearGradient>

    <linearGradient id="centerTargetBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1e2e"/>
      <stop offset="50%" stop-color="#082b24"/>
      <stop offset="100%" stop-color="#0b1e2e"/>
    </linearGradient>

    <linearGradient id="targetBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="convGridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#14b8a6" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .card-title { font-size: 13px; font-weight: 800; letter-spacing: 2px; }
    .card-item { font-size: 11.5px; fill: #cbd5e1; font-weight: 400; }
    .accent-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 1.5px; }
    .chip-mono { font-size: 9.5px; fill: #94a3b8; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect width="998" height="428" x="1" y="1" rx="14" fill="url(#convBg)"/>
  <rect width="998" height="428" x="1" y="1" rx="14" fill="url(#convGlow)"/>
  <rect width="998" height="428" x="1" y="1" rx="14" fill="url(#convGridPattern)"/>
  <rect width="998" height="428" x="1" y="1" rx="14" fill="none" stroke="url(#convBorder)" stroke-width="1.5"/>

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="998" height="40" rx="14" fill="#040b15" fill-opacity="0.9"/>
  <line x1="1" y1="41" x2="999" y2="41" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <g transform="translate(26, 21)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="15" cy="0" r="4.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="30" cy="0" r="4.5" fill="#10b981" fill-opacity="0.85"/>
    <text x="52" y="3.5" class="mono" font-size="11" fill="#64748b" letter-spacing="1px">synthesis_engine.arch.ts // SYSTEMS ENGINEERING &amp; DESIGN CONVERGENCE</text>
  </g>

  <!-- Top Right Status -->
  <g transform="translate(970, 21)" text-anchor="end">
    <circle cx="-160" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-160" cy="0" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-142" y="3.5" class="mono" font-size="10" fill="#2dd4bf" font-weight="700" letter-spacing="1.5px">DUAL-CORE DISCIPLINE</text>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5">
    <path d="M 18 56 L 18 48 L 26 48"/>
    <path d="M 982 56 L 982 48 L 974 48"/>
    <path d="M 18 408 L 18 416 L 26 416"/>
    <path d="M 982 408 L 982 416 L 974 416"/>
  </g>

  <!-- ================= LEFT CARD: SYSTEMS ENGINEERING ================= -->
  <g transform="translate(36, 62)">
    <rect width="425" height="220" rx="9" fill="url(#cEngBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="425" height="38" rx="9" fill="#081e30" fill-opacity="0.8"/>
    <line x1="0" y1="38" x2="425" y2="38" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#38bdf8"/>
    <text x="34" y="23" class="mono card-title" fill="#38bdf8">SYSTEMS ENGINEERING</text>
    <rect x="300" y="9" width="112" height="20" rx="4" fill="#031a29" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="356" y="23" text-anchor="middle" class="mono accent-tag" fill="#38bdf8">BACKEND &amp; ARCH</text>

    <!-- Bullets -->
    <g transform="translate(20, 60)">
      <circle cx="4" cy="-3" r="2.5" fill="#38bdf8"/>
      <text x="16" y="0" class="sans card-item">Distributed API &amp; Microservices Architecture</text>

      <circle cx="4" cy="22" r="2.5" fill="#38bdf8"/>
      <text x="16" y="25" class="sans card-item">Schema Optimization &amp; Compound Indexing</text>

      <circle cx="4" cy="47" r="2.5" fill="#38bdf8"/>
      <text x="16" y="50" class="sans card-item">State Synchronization, Redis Caching &amp; Queues</text>

      <circle cx="4" cy="72" r="2.5" fill="#38bdf8"/>
      <text x="16" y="75" class="sans card-item">CI/CD, Cloud Deployment &amp; Defensive Logic</text>
    </g>

    <!-- Tech Chips -->
    <g transform="translate(20, 178)">
      <rect x="0" y="0" width="84" height="24" rx="5" fill="#03111e" stroke="#1e293b" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" class="mono chip-mono">TypeScript</text>

      <rect x="92" y="0" width="76" height="24" rx="5" fill="#03111e" stroke="#1e293b" stroke-width="1"/>
      <text x="130" y="16" text-anchor="middle" class="mono chip-mono">Node.js</text>

      <rect x="176" y="0" width="76" height="24" rx="5" fill="#03111e" stroke="#1e293b" stroke-width="1"/>
      <text x="214" y="16" text-anchor="middle" class="mono chip-mono">MongoDB</text>

      <rect x="260" y="0" width="62" height="24" rx="5" fill="#03111e" stroke="#1e293b" stroke-width="1"/>
      <text x="291" y="16" text-anchor="middle" class="mono chip-mono">Redis</text>
    </g>
  </g>

  <!-- ================= RIGHT CARD: VISUAL DESIGN SYSTEMS ================= -->
  <g transform="translate(539, 62)">
    <rect width="425" height="220" rx="9" fill="url(#cDesBg)" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="425" height="38" rx="9" fill="#04231e" fill-opacity="0.8"/>
    <line x1="0" y1="38" x2="425" y2="38" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#2dd4bf"/>
    <text x="34" y="23" class="mono card-title" fill="#2dd4bf">VISUAL DESIGN SYSTEMS</text>
    <rect x="320" y="9" width="92" height="20" rx="4" fill="#021c17" stroke="#2dd4bf" stroke-width="0.8"/>
    <text x="366" y="23" text-anchor="middle" class="mono accent-tag" fill="#2dd4bf">UI / UX / BRAND</text>

    <!-- Bullets -->
    <g transform="translate(20, 60)">
      <circle cx="4" cy="-3" r="2.5" fill="#2dd4bf"/>
      <text x="16" y="0" class="sans card-item">Typography, Optical Balance &amp; Strict Grid Rules</text>

      <circle cx="4" cy="22" r="2.5" fill="#2dd4bf"/>
      <text x="16" y="25" class="sans card-item">Brand Identity, Vector Mark &amp; Design Guidelines</text>

      <circle cx="4" cy="47" r="2.5" fill="#2dd4bf"/>
      <text x="16" y="50" class="sans card-item">Figma Design Tokens to Semantic React Tokens</text>

      <circle cx="4" cy="72" r="2.5" fill="#2dd4bf"/>
      <text x="16" y="75" class="sans card-item">High-Fidelity Micro-interactions &amp; Accessibility</text>
    </g>

    <!-- Tech Chips -->
    <g transform="translate(20, 178)">
      <rect x="0" y="0" width="60" height="24" rx="5" fill="#021310" stroke="#1e293b" stroke-width="1"/>
      <text x="30" y="16" text-anchor="middle" class="mono chip-mono">Figma</text>

      <rect x="68" y="0" width="86" height="24" rx="5" fill="#021310" stroke="#1e293b" stroke-width="1"/>
      <text x="111" y="16" text-anchor="middle" class="mono chip-mono">Illustrator</text>

      <rect x="162" y="0" width="102" height="24" rx="5" fill="#021310" stroke="#1e293b" stroke-width="1"/>
      <text x="213" y="16" text-anchor="middle" class="mono chip-mono">Design Tokens</text>

      <rect x="272" y="0" width="84" height="24" rx="5" fill="#021310" stroke="#1e293b" stroke-width="1"/>
      <text x="314" y="16" text-anchor="middle" class="mono chip-mono">TailwindCSS</text>
    </g>
  </g>

  <!-- ================= MIDDLE BI-DIRECTIONAL BRIDGE ================= -->
  <g transform="translate(461, 155)">
    <line x1="0" y1="12" x2="78" y2="12" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="4,12 10,8 10,16" fill="#38bdf8"/>
    <polygon points="74,12 68,8 68,16" fill="#2dd4bf"/>
    <!-- Center synergy badge -->
    <rect x="8" y="-3" width="62" height="30" rx="6" fill="#040d16" stroke="#1e293b" stroke-width="1.2"/>
    <text x="39" y="16" text-anchor="middle" class="mono" font-size="9" fill="#2dd4bf" font-weight="700" letter-spacing="1px">SYNTHESIS</text>
  </g>

  <!-- Connectors to Production Box -->
  <path d="M 248 282 L 248 305 L 490 305 L 490 318" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.7"/>
  <path d="M 751 282 L 751 305 L 510 305 L 510 318" fill="none" stroke="#2dd4bf" stroke-width="1.3" stroke-opacity="0.7"/>
  <polygon points="500,323 494,314 506,314" fill="#10b981"/>

  <!-- ================= BOTTOM PRODUCTION TARGET ================= -->
  <g transform="translate(180, 325)">
    <rect width="640" height="82" rx="10" fill="url(#centerTargetBg)" stroke="url(#targetBorder)" stroke-width="1.6"/>
    <!-- Corner Crosshairs -->
    <g stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.6">
      <path d="M 12 12 L 12 18 M 9 15 L 15 15"/>
      <path d="M 628 12 L 628 18 M 625 15 L 631 15"/>
    </g>
    <!-- Text -->
    <text x="320" y="32" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="3px">
      PRODUCTION-GRADE SCALABLE APPLICATIONS
    </text>
    <text x="320" y="56" text-anchor="middle" class="sans" font-size="11.5" font-weight="500" fill="#cbd5e1" letter-spacing="0.8px">
      Sub-100ms API Latency &#x2022; 99+ Core Web Vitals &#x2022; Zero Design-to-Code Translation Debt
    </text>
  </g>
</svg>
