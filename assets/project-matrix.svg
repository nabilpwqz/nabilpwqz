    .card-title { font-size: 15px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
    .tag-badge { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; }
    .role-lead { font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
    .deliv-line { font-size: 10.5px; fill: #cbd5e1; font-weight: 400; }
    .chip-style { font-size: 9.5px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.5px; }
