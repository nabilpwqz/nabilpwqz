<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="benchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#071524"/>
      <stop offset="75%" stop-color="#04221d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="benchGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="benchBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Row Backgrounds -->
    <linearGradient id="rowBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071828"/>
      <stop offset="100%" stop-color="#030e18"/>
    </linearGradient>

    <linearGradient id="rowBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05211c"/>
      <stop offset="100%" stop-color="#02110e"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="benchGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#14b8a6" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .row-title { font-size: 12px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.5px; }
    .sla-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .impl-desc { font-size: 11px; fill: #cbd5e1; font-weight: 400; }
    .col-header { font-size: 10px; fill: #64748b; letter-spacing: 1.5px; font-weight: 700; }
  </style>

  <!-- Container Box -->
  <rect width="998" height="358" x="1" y="1" rx="14" fill="url(#benchBg)"/>
  <rect width="998" height="358" x="1" y="1" rx="14" fill="url(#benchGlow)"/>
  <rect width="998" height="358" x="1" y="1" rx="14" fill="url(#benchGrid)"/>
  <rect width="998" height="358" x="1" y="1" rx="14" fill="none" stroke="url(#benchBorder)" stroke-width="1.5"/>

  <!-- Top Titlebar Strip -->
  <rect x="1" y="1" width="998" height="38" rx="14" fill="#040b15" fill-opacity="0.9"/>
  <line x1="1" y1="39" x2="999" y2="39" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Dots -->
  <g transform="translate(24, 19)">
    <circle cx="0" cy="0" r="4.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="14" cy="0" r="4.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="28" cy="0" r="4.5" fill="#10b981" fill-opacity="0.85"/>
    <text x="48" y="3.5" class="mono" font-size="11" fill="#64748b" letter-spacing="1px">production_sla.benchmarks.ts // ENTERPRISE ARCHITECTURE STANDARDS</text>
  </g>

  <!-- Titlebar Telemetry -->
  <g transform="translate(970, 19)" text-anchor="end">
    <circle cx="-160" cy="0" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-160" cy="0" r="7" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-142" y="3.5" class="mono" font-size="10" fill="#2dd4bf" font-weight="700" letter-spacing="1.5px">PRODUCTION SLA VERIFIED</text>
  </g>

  <!-- Table Column Headers -->
  <g transform="translate(36, 62)">
    <text x="14" y="0" class="mono col-header">ENGINEERING METRIC</text>
    <text x="280" y="0" class="mono col-header">PRODUCTION SLA</text>
    <text x="470" y="0" class="mono col-header">ARCHITECTURE &amp; IMPLEMENTATION STANDARD</text>
  </g>

  <!-- ================= 5 BENCHMARK ROWS ================= -->

  <!-- Row 1: API Latency & Throughput -->
  <g transform="translate(36, 76)">
    <rect width="928" height="42" rx="7" fill="url(#rowBg1)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="3" fill="#2dd4bf"/>
    <text x="34" y="25" class="sans row-title">API Latency &amp; Throughput</text>

    <!-- SLA Tag -->
    <rect x="270" y="9" width="130" height="24" rx="5" fill="#021c17" stroke="#10b981" stroke-width="0.9"/>
    <text x="335" y="25" text-anchor="middle" class="mono sla-tag" fill="#10b981">P95 &lt; 100ms</text>

    <!-- Description -->
    <text x="470" y="25" class="sans impl-desc">Multi-tier Redis caching, indexed MongoDB pipelines &amp; connection pooling</text>
  </g>

  <!-- Row 2: Architecture Type Safety -->
  <g transform="translate(36, 124)">
    <rect width="928" height="42" rx="7" fill="url(#rowBg2)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="3" fill="#38bdf8"/>
    <text x="34" y="25" class="sans row-title">Architecture Type Safety</text>

    <!-- SLA Tag -->
    <rect x="270" y="9" width="154" height="24" rx="5" fill="#031a29" stroke="#38bdf8" stroke-width="0.9"/>
    <text x="347" y="25" text-anchor="middle" class="mono sla-tag" fill="#38bdf8">100% Strict Typing</text>

    <!-- Description -->
    <text x="470" y="25" class="sans impl-desc">End-to-end TypeScript contracts, Zod runtime validation &amp; defensive boundaries</text>
  </g>

  <!-- Row 3: Core Web Vitals -->
  <g transform="translate(36, 172)">
    <rect width="928" height="42" rx="7" fill="url(#rowBg1)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="3" fill="#10b981"/>
    <text x="34" y="25" class="sans row-title">Core Web Vitals</text>

    <!-- SLA Tag -->
    <rect x="270" y="9" width="138" height="24" rx="5" fill="#021c17" stroke="#10b981" stroke-width="0.9"/>
    <text x="339" y="25" text-anchor="middle" class="mono sla-tag" fill="#10b981">98 - 100 Score</text>

    <!-- Description -->
    <text x="470" y="25" class="sans impl-desc">Next.js SSR/SSG caching, zero layout shifts, asset compression &amp; lazy hydration</text>
  </g>

  <!-- Row 4: Real-Time Synchronization -->
  <g transform="translate(36, 220)">
    <rect width="928" height="42" rx="7" fill="url(#rowBg2)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="3" fill="#2dd4bf"/>
    <text x="34" y="25" class="sans row-title">Real-Time Synchronization</text>

    <!-- SLA Tag -->
    <rect x="270" y="9" width="150" height="24" rx="5" fill="#021a1b" stroke="#2dd4bf" stroke-width="0.9"/>
    <text x="345" y="25" text-anchor="middle" class="mono sla-tag" fill="#2dd4bf">Sub-50ms Latency</text>

    <!-- Description -->
    <text x="470" y="25" class="sans impl-desc">Bi-directional WebSockets, Redis Pub/Sub brokers &amp; distributed event queues</text>
  </g>

  <!-- Row 5: Security & Auth Standard -->
  <g transform="translate(36, 268)">
    <rect width="928" height="42" rx="7" fill="url(#rowBg1)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="20" cy="21" r="3" fill="#c084fc"/>
    <text x="34" y="25" class="sans row-title">Security &amp; Auth Standard</text>

    <!-- SLA Tag -->
    <rect x="270" y="9" width="152" height="24" rx="5" fill="#1a0a26" stroke="#c084fc" stroke-width="0.9"/>
    <text x="346" y="25" text-anchor="middle" class="mono sla-tag" fill="#c084fc">Zero-Trust Model</text>

    <!-- Description -->
    <text x="470" y="25" class="sans impl-desc">Cryptographic JWT rotation, atomic checkout states &amp; role-based access control (RBAC)</text>
  </g>

  <!-- Bottom Telemetry Ribbon -->
  <g transform="translate(36, 320)">
    <rect width="928" height="26" rx="6" fill="#040c17" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="16" cy="13" r="3" fill="#10b981"/>
    <text x="30" y="16.5" class="mono" font-size="9.5" fill="#cbd5e1" letter-spacing="1.5px">PRODUCTION-GRADE RELIABILITY // HIGH-THROUGHPUT PIPELINES // DEFENSIVE SECURITY ARCHITECTURE</text>
    <text x="912" y="16.5" text-anchor="end" class="mono" font-size="9" fill="#64748b">[ SLA AUDITED ]</text>
  </g>
</svg>
